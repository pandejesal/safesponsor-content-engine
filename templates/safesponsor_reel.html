<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            width: 1080px;
            height: 1920px;
            background: #0a0a0a;
            overflow: hidden;
            color: #ffffff;
        }
        
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
        }
        
        .scene.active {
            opacity: 1;
            pointer-events: all;
        }
        
        /* === SCENE 1: HOOK === */
        #scene-1 {
            background: #0a0a0a;
        }
        
        .hook-line {
            font-size: 84px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 1;
            opacity: 0;
            transform: translateY(60px) scale(0.8);
        }
        
        .hook-line.animate {
            animation: snapIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .hook-line:nth-child(1) { color: #22d3ee; animation-delay: 0s; }
        .hook-line:nth-child(2) { color: #ffffff; animation-delay: 0.15s; }
        
        .hook-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background: rgba(34, 211, 238, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.4);
            border-radius: 100px;
            margin-top: 40px;
            opacity: 0;
            transform: scale(0.5);
        }
        
        .hook-badge.animate {
            animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
        }
        
        .hook-badge-text {
            font-size: 18px;
            font-weight: 700;
            color: #22d3ee;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .logo-icon {
            margin-bottom: 32px;
            opacity: 0;
            transform: scale(0) rotate(-180deg);
        }
        
        .logo-icon.animate {
            animation: spinIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        /* === SCENE 2: SCORE === */
        #scene-2 {
            background: #0a0a0a;
        }
        
        .score-label {
            font-size: 20px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 6px;
            opacity: 0;
            transform: translateY(30px);
        }
        
        .score-label.animate {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .score-number {
            font-size: 220px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -12px;
            opacity: 0;
            transform: scale(3);
        }
        
        .score-number.animate {
            animation: scoreReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }
        
        .score-number.safe { color: #22c55e; }
        .score-number.caution { color: #f59e0b; }
        .score-number.risky { color: #ef4444; }
        
        .score-suffix {
            font-size: 48px;
            color: #475569;
            font-weight: 700;
            letter-spacing: 0;
        }
        
        .score-bar {
            width: 500px;
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            margin-top: 48px;
            overflow: hidden;
            opacity: 0;
        }
        
        .score-bar.animate {
            animation: fadeIn 0.4s ease 0.4s forwards;
        }
        
        .score-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .score-fill.safe { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .score-fill.caution { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .score-fill.risky { background: linear-gradient(90deg, #ef4444, #f87171); }
        
        /* === SCENE 3: STATS === */
        #scene-3 {
            background: #0a0a0a;
        }
        
        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 800px;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 32px;
            opacity: 0;
            transform: translateX(-80px);
        }
        
        .stat-row.animate {
            animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .stat-row:nth-child(1).animate { animation-delay: 0s; }
        .stat-row:nth-child(2).animate { animation-delay: 0.12s; }
        .stat-row:nth-child(3).animate { animation-delay: 0.24s; }
        
        .stat-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .stat-icon.red { background: rgba(239, 68, 68, 0.2); }
        .stat-icon.amber { background: rgba(245, 158, 11, 0.2); }
        .stat-icon.gray { background: rgba(100, 116, 139, 0.2); }
        
        .stat-content {
            flex: 1;
        }
        
        .stat-value {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 16px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-top: 4px;
        }
        
        /* === SCENE 4: CTA === */
        #scene-4 {
            background: #0a0a0a;
        }
        
        .cta-logo {
            margin-bottom: 32px;
            opacity: 0;
            transform: scale(0) rotate(-180deg);
        }
        
        .cta-logo.animate {
            animation: spinIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .cta-title {
            font-size: 64px;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            letter-spacing: -2px;
            opacity: 0;
            transform: translateY(40px);
        }
        
        .cta-title.animate {
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
        }
        
        .cta-title span { color: #22d3ee; }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            padding: 20px 40px;
            background: linear-gradient(135deg, #ea580c, #f97316);
            border-radius: 14px;
            margin-top: 40px;
            opacity: 0;
            transform: translateY(30px) scale(0.9);
        }
        
        .cta-button.animate {
            animation: popUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
        }
        
        .cta-button-text {
            font-size: 20px;
            font-weight: 800;
            color: white;
        }
        
        .cta-url {
            font-size: 18px;
            color: #475569;
            margin-top: 24px;
            opacity: 0;
        }
        
        .cta-url.animate {
            animation: fadeIn 0.4s ease 0.45s forwards;
        }
        
        /* === ANIMATIONS === */
        @keyframes snapIn {
            0% { opacity: 0; transform: translateY(60px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes scoreReveal {
            0% { opacity: 0; transform: scale(3); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1); filter: blur(0); }
        }
        
        @keyframes slideRight {
            0% { opacity: 0; transform: translateX(-80px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes spinIn {
            0% { opacity: 0; transform: scale(0) rotate(-180deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        
        @keyframes popUp {
            0% { opacity: 0; transform: translateY(30px) scale(0.9); }
            70% { transform: translateY(-5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Scene 1: Hook -->
    <div id="scene-1" class="scene active">
        <div class="logo-icon">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <defs>
                    <clipPath id="hex">
                        <path d="M50 8 L85 28 L85 72 L50 92 L15 72 L15 28 Z"/>
                    </clipPath>
                </defs>
                <rect width="100" height="100" rx="20" fill="#09090b"/>
                <g clip-path="url(#hex)">
                    <circle cx="40" cy="50" r="32" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
                    <circle cx="60" cy="50" r="32" fill="none" stroke="#f97316" stroke-width="3" opacity="0.9"/>
                </g>
                <path d="M50 8 L85 28 L85 72 L50 92 L15 72 L15 28 Z" fill="none" stroke="#fafafa" stroke-width="3" stroke-linejoin="round"/>
                <text x="50" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#fafafa">S</text>
            </svg>
        </div>
        <div class="hook-line">BRAND</div>
        <div class="hook-line">SAFETY</div>
        <div class="hook-badge">
            <span class="hook-badge-text">AUDIT REPORT</span>
        </div>
    </div>
    
    <!-- Scene 2: Score -->
    <div id="scene-2" class="scene">
        <div class="score-label">SAFETY SCORE</div>
        <div class="score-number {{STATUS_CLASS}}">{{RISK_SCORE}}<span class="score-suffix">/100</span></div>
        <div class="score-bar">
            <div class="score-fill {{STATUS_CLASS}}" id="score-fill"></div>
        </div>
    </div>
    
    <!-- Scene 3: Stats -->
    <div id="scene-3" class="scene">
        <div class="stats-container">
            <div class="stat-row">
                <div class="stat-icon red">
                    <svg width="32" height="32" fill="none" stroke="#ef4444" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-value">{{SLURS_COUNT}}</div>
                    <div class="stat-label">SLURS DETECTED</div>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-icon amber">
                    <svg width="32" height="32" fill="none" stroke="#f59e0b" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-value">{{POLICY_FLAGS}}</div>
                    <div class="stat-label">POLICY FLAGS</div>
                </div>
            </div>
            <div class="stat-row">
                <div class="stat-icon gray">
                    <svg width="32" height="32" fill="none" stroke="#64748b" stroke-width="2.5" viewBox="0 0 24 24">
                        <path d="M17.98 18.72l-1.56-1.56a2 2 0 01-2.83 0L6.02 7.72a2 2 0 010-2.83l1.56-1.56a2 2 0 012.83 0l7.57 7.57a2 2 0 010 2.83z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <div class="stat-content">
                    <div class="stat-value">{{PROFANITY_COUNT}}</div>
                    <div class="stat-label">PROFANITY</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scene 4: CTA -->
    <div id="scene-4" class="scene">
        <div class="cta-logo">
            <svg viewBox="0 0 100 100" width="80" height="80">
                <defs>
                    <clipPath id="hex2">
                        <path d="M50 8 L85 28 L85 72 L50 92 L15 72 L15 28 Z"/>
                    </clipPath>
                </defs>
                <rect width="100" height="100" rx="20" fill="#09090b"/>
                <g clip-path="url(#hex2)">
                    <circle cx="40" cy="50" r="32" fill="none" stroke="#06b6d4" stroke-width="3" opacity="0.9"/>
                    <circle cx="60" cy="50" r="32" fill="none" stroke="#f97316" stroke-width="3" opacity="0.9"/>
                </g>
                <path d="M50 8 L85 28 L85 72 L50 92 L15 72 L15 28 Z" fill="none" stroke="#fafafa" stroke-width="3" stroke-linejoin="round"/>
                <text x="50" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#fafafa">S</text>
            </svg>
        </div>
        <div class="cta-title">RUN A FREE<br><span>CREATOR AUDIT</span></div>
        <div class="cta-button">
            <svg width="24" height="24" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <span class="cta-button-text">SafeSponsor AI</span>
        </div>
        <div class="cta-url">safe-sponsor-ai.vercel.app</div>
    </div>
    
    <script>
        function activateScene(index) {
            document.querySelectorAll('.scene').forEach((s, i) => {
                s.classList.remove('active');
                s.querySelectorAll('.animate').forEach(el => el.classList.remove('animate'));
            });
            
            const scene = document.getElementById('scene-' + (index + 1));
            scene.classList.add('active');
            
            requestAnimationFrame(() => {
                scene.querySelectorAll('.logo-icon, .hook-line, .hook-badge, .score-label, .score-number, .score-bar, .stat-row, .cta-logo, .cta-title, .cta-button, .cta-url').forEach(el => {
                    el.classList.add('animate');
                });
                
                if (index === 1) {
                    setTimeout(() => {
                        document.getElementById('score-fill').style.width = '{{RISK_SCORE}}%';
                    }, 500);
                }
            });
        }
        
        window.activateScene = activateScene;
    </script>
</body>
</html>
