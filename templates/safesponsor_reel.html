<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
            width: 1080px;
            height: 1920px;
            background: #f8fafc;
            overflow: hidden;
            color: #0f172a;
        }
        
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            pointer-events: none;
        }
        
        .scene.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: all;
        }
        
        .scene.exit {
            opacity: 0;
            transform: scale(1.05);
        }
        
        /* Scene 1: Hook */
        #scene-1 {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        .shield-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            box-shadow: 0 0 60px rgba(34, 211, 238, 0.4);
            animation: pulse-glow 2s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 60px rgba(34, 211, 238, 0.4); }
            50% { box-shadow: 0 0 80px rgba(34, 211, 238, 0.6); }
        }
        
        .hook-title {
            font-size: 72px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            letter-spacing: -2px;
            line-height: 1.1;
            margin-bottom: 24px;
        }
        
        .hook-subtitle {
            font-size: 28px;
            font-weight: 600;
            color: #94a3b8;
            text-align: center;
            max-width: 800px;
        }
        
        /* Scene 2: Score */
        #scene-2 {
            background: #f8fafc;
        }
        
        .score-container {
            text-align: center;
        }
        
        .score-label {
            font-size: 24px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        
        .score-number {
            font-size: 180px;
            font-weight: 900;
            color: #16a34a;
            line-height: 1;
            letter-spacing: -8px;
        }
        
        .score-suffix {
            font-size: 60px;
            color: #94a3b8;
            font-weight: 700;
        }
        
        .score-bar {
            width: 600px;
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            margin-top: 40px;
            overflow: hidden;
        }
        
        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            border-radius: 6px;
            width: 0%;
            transition: width 1.5s ease-out;
        }
        
        /* Scene 3: Stats */
        #scene-3 {
            background: #ffffff;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
            width: 900px;
        }
        
        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 72px;
            font-weight: 900;
            color: #16a34a;
            line-height: 1;
        }
        
        .stat-label {
            font-size: 18px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 16px;
        }
        
        /* Scene 4: CTA */
        #scene-4 {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        .cta-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 16px 32px;
            background: rgba(34, 211, 238, 0.15);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 12px;
            margin-bottom: 40px;
        }
        
        .cta-badge-text {
            font-size: 20px;
            font-weight: 800;
            color: #22d3ee;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .cta-title {
            font-size: 56px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            padding: 24px 48px;
            background: linear-gradient(135deg, #ea580c, #f97316);
            border-radius: 16px;
            box-shadow: 0 8px 40px rgba(234, 88, 12, 0.4);
            margin-top: 40px;
        }
        
        .cta-button-text {
            font-size: 24px;
            font-weight: 800;
            color: white;
        }
        
        .cta-url {
            font-size: 20px;
            color: #94a3b8;
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <!-- Scene 1: Hook -->
    <div id="scene-1" class="scene active">
        <div class="shield-icon">
            <svg width="64" height="64" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
        </div>
        <div class="hook-title">Brand Safety<br>Audit Report</div>
        <div class="hook-subtitle">AI-powered creator sponsorship vetting</div>
    </div>
    
    <!-- Scene 2: Score -->
    <div id="scene-2" class="scene">
        <div class="score-container">
            <div class="score-label">Safety Score</div>
            <div class="score-number">{{RISK_SCORE}}<span class="score-suffix">/100</span></div>
            <div class="score-bar">
                <div class="score-fill" id="score-fill"></div>
            </div>
        </div>
    </div>
    
    <!-- Scene 3: Stats -->
    <div id="scene-3" class="scene">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">{{SLURS_COUNT}}</div>
                <div class="stat-label">Slurs</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{{POLICY_FLAGS}}</div>
                <div class="stat-label">Policy Flags</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">{{PROFANITY_COUNT}}</div>
                <div class="stat-label">Profanity</div>
            </div>
        </div>
    </div>
    
    <!-- Scene 4: CTA -->
    <div id="scene-4" class="scene">
        <div class="cta-badge">
            <svg width="24" height="24" fill="none" stroke="#22d3ee" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <span class="cta-badge-text">SafeSponsor AI</span>
        </div>
        <div class="cta-title">Run a Free<br>Creator Audit</div>
        <div class="cta-button">
            <svg width="28" height="28" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>
            <span class="cta-button-text">safe-sponsor-ai.vercel.app</span>
        </div>
        <div class="cta-url">safe-sponsor-ai.vercel.app</div>
    </div>
    
    <script>
        const scenes = ['scene-1', 'scene-2', 'scene-3', 'scene-4'];
        let currentScene = 0;
        
        function showScene(index) {
            scenes.forEach((id, i) => {
                const el = document.getElementById(id);
                el.classList.remove('active', 'exit');
                if (i === index) {
                    el.classList.add('active');
                } else if (i < index) {
                    el.classList.add('exit');
                }
            });
            
            if (index === 1) {
                setTimeout(() => {
                    document.getElementById('score-fill').style.width = '{{RISK_SCORE}}%';
                }, 300);
            }
        }
        
        window.showScene = showScene;
    </script>
</body>
</html>
